# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from the Render dashboard: New > Blueprint > connect this repo.
services:
  - type: web
    plan: free
    name: spotify-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SPOTIFY_MARKET
        value: AU
